<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Contoh CSS Internal</title>
  <style>
    body {
      background-color: #e0f7fa;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #00695c;
      text-align: center;
    }
    p {
      color: #444;
      font-size: 17px;
      line-height: 1.6;
    }
    .info {
      background-color: #ffe0b2;
      padding: 12px;
      border-radius: 8px;
    }

</head>
<body>
  <h1>Happy Paws Jember</h1>
  <p>Konsultasi, vaksinasi, dan grooming untuk hewan kesayanganmu.</p>

</html>
